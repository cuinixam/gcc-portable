name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: true
      - name: Install pypeline-runner
        run: pip install pypeline-runner>=1.27
        shell: bash
      - name: Run pypeline
        run: pypeline run --step PreCommit
        shell: bash

  # Make sure commit messages follow the conventional commits convention:
  # https://www.conventionalcommits.org
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6.0.1

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
        os:
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # uv's Python builds bundle a pip with the emSign fix also for 3.11; python.org's do not.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python
        run: |
          uv python install ${{ matrix.python-version }}
          uv python dir --bin >> "$GITHUB_PATH"
        shell: bash
      - name: Install pypeline-runner
        run: |
          uv tool install "pypeline-runner>=1.27"
          uv tool dir --bin >> "$GITHUB_PATH"
        shell: bash
      - name: Run pypeline
        run: pypeline run --step CreateVEnv --step PyTest --single --input python_version=${{ matrix.python-version }}
        shell: bash
